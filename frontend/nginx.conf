server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend service, so the browser uses one origin (no CORS).
    location /api/ {
        # Above the backend's MAX_UPLOAD_BYTES (2 MB by default), so the API, not nginx,
        # answers oversized uploads with its own 413 message.
        client_max_body_size 4m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
